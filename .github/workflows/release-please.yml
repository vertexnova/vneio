#
# Description: Release Please + publish prebuilt install trees per platform.
#
# Artifact naming (semver + matrix.platform + ARTIFACT_DETAIL):
#   vneio-v{VERSION}-{matrix.platform}-{ARTIFACT_DETAIL}.tar.gz
#   matrix.platform ∈ linux-gcc | macos | windows | web-emscripten | ios-static | android
#
# ARTIFACT_DETAIL is produced by "Compute artifact detail suffix" (see that step). Rules:
#   linux-gcc:        ubuntu{VERSION_ID dots removed}-gcc{gcc -dumpfullversion dots removed}-{uname -m}
#                     e.g. Ubuntu 22.04, GCC 13.2.0 → ubuntu2204-gcc1320-x86_64
#   macos:            macos{sw_vers dots removed}-xcode{xcodebuild dots removed}-{uname -m}
#                     (xcode segment omitted if xcodebuild does not parse)
#                     e.g. macOS 14.2 + Xcode 26.0 → macos1421-xcode260-arm64
#   windows:          vs2022-x64  (fixed; no uname -m)
#   web-emscripten:   emcc{emcc -dumpversion output}-{uname -m}
#                     e.g. emcc3.1.64-x86_64  (Emcc version keeps dots)
#   ios-static:       xcode{major.minor.patch with '.' removed}-arm64 when xcodebuild parses;
#                     otherwise ios-arm64 (version intentionally ignored).
#   android:          android{API level}-ndk{Pkg.Revision from NDK source.properties, '.' removed}-arm64v8a
#                     e.g. API 24, NDK 27.2.12479018 → android24-ndk27212479018-arm64v8a
#
# Examples (illustrative; exact strings depend on runner / toolchain):
#   .../vneio-v1.2.3-linux-gcc-ubuntu2204-gcc1320-x86_64.tar.gz
#   .../vneio-v1.2.3-macos-macos1421-xcode260-arm64.tar.gz
#   .../vneio-v1.2.3-windows-vs2022-x64.tar.gz
#   .../vneio-v1.2.3-web-emscripten-emcc3.1.64-x86_64.tar.gz
#   .../vneio-v1.2.3-ios-static-xcode260-arm64.tar.gz
#   .../vneio-v1.2.3-ios-static-ios-arm64.tar.gz   (fallback when Xcode version not parsed)
#   .../vneio-v1.2.3-android-android24-ndk27212479018-arm64v8a.tar.gz
#
# Archive layout (cmake --install prefix): include/, lib/ (and bin/ on Windows),
# LICENSE, CHANGELOG.md; plus platform-specific outputs (e.g. .wasm/.js for web).
#
# Web / iOS / Android jobs mirror .github/workflows/ci.yml where applicable; validate locally
# before relying on release binaries in production.
#
# Autodoc:   yes
# ----------------------------------------------------------------------

name: Release Please

on:
  push:
    branches: ["main"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: "Release / release-please"
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Enable auto-merge on Release PR
        if: steps.rp.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}
          PR_RAW: ${{ steps.rp.outputs.pr }}
        run: |
          PR_NUMBER="$(echo "$PR_RAW" | python3 -c 'import sys,json; print(json.load(sys.stdin)["number"])')"
          if ! gh pr merge --repo "${{ github.repository }}" --auto --squash "$PR_NUMBER" 2>&1 | tee /tmp/gh-out; then
            if grep -q "enablePullRequestAutoMerge\|Auto merge is not allowed" /tmp/gh-out; then
              echo "::warning::Auto-merge is disabled for this repo. Enable Settings -> General -> Pull Requests -> 'Allow auto-merge'. Release PR #$PR_NUMBER remains open for manual merge."
              exit 0
            fi
            exit 1
          fi

  publish:
    name: "Release / publish (${{ matrix.platform }})"
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-gcc
            runner: ubuntu-latest
            build_dir: build/shared/Release
            c: gcc
            cpp: g++
          - platform: macos
            runner: macos-latest
            build_dir: build/shared/Release
            c: ""
            cpp: ""
          - platform: windows
            runner: windows-latest
            build_dir: build/shared/Release
            c: ""
            cpp: ""
          - platform: web-emscripten
            runner: ubuntu-latest
            build_dir: build/shared/Release
            c: ""
            cpp: ""
          - platform: ios-static
            runner: macos-latest
            build_dir: build/static/Release
            c: ""
            cpp: ""
          - platform: android
            runner: ubuntu-latest
            build_dir: build/shared/Release
            c: ""
            cpp: ""

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Use HTTPS for GitHub (CI runners have no SSH key)
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          submodules: recursive

      - name: Setup Android NDK
        if: matrix.platform == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      # Pin Xcode 26 for Apple builds (desktop + iOS). If a runner image lacks 26.x, change
      # xcode-version (e.g. latest-stable) or use a runner that ships Xcode 26.
      - name: Select Xcode 26 (macOS + iOS)
        if: matrix.platform == 'macos' || matrix.platform == 'ios-static'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux-gcc'
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential cmake libassimp-dev

      - name: Use system Assimp on Linux (native)
        if: matrix.platform == 'linux-gcc'
        shell: bash
        run: rm -rf deps/external/assimp

      - name: Install Assimp (macOS — desktop + iOS jobs)
        if: matrix.platform == 'macos' || matrix.platform == 'ios-static'
        run: brew install assimp

      - name: Use system Assimp on macOS / iOS
        if: matrix.platform == 'macos' || matrix.platform == 'ios-static'
        shell: bash
        run: rm -rf deps/external/assimp

      - name: Install Emscripten
        if: matrix.platform == 'web-emscripten'
        uses: mymindstorm/setup-emscripten@v14

      - name: Configure CMake (Linux / macOS / Windows desktop)
        if: matrix.platform != 'web-emscripten' && matrix.platform != 'ios-static' && matrix.platform != 'android'
        shell: bash
        env:
          INSTALL_PREFIX: ${{ github.workspace }}/install
        run: |
          set -e
          COMPILER_FLAGS=""
          if [[ -n "${{ matrix.c }}" ]]; then
            COMPILER_FLAGS="-DCMAKE_C_COMPILER=${{ matrix.c }} -DCMAKE_CXX_COMPILER=${{ matrix.cpp }}"
          fi
          BUILD_DIR="${{ matrix.build_dir }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cmake -B "$BUILD_DIR" -S . -G "Visual Studio 17 2022" -A x64 \
              -DVNEIO_CI=ON \
              -DVNEIO_LIB_TYPE=shared \
              -DVNEIO_BUILD_TESTS=OFF \
              -DVNEIO_SANITIZE_INSTALL=ON \
              -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX" \
              $COMPILER_FLAGS
          else
            cmake -B "$BUILD_DIR" -S . \
              -DCMAKE_BUILD_TYPE=Release \
              -DVNEIO_CI=ON \
              -DVNEIO_LIB_TYPE=shared \
              -DVNEIO_BUILD_TESTS=OFF \
              -DVNEIO_SANITIZE_INSTALL=ON \
              -DENABLE_IPO=OFF \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX" \
            $COMPILER_FLAGS
          fi

      - name: Configure CMake (Android)
        if: matrix.platform == 'android'
        shell: bash
        env:
          INSTALL_PREFIX: ${{ github.workspace }}/install
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_ROOT}"
          if [[ -z "$NDK" || ! -f "$NDK/build/cmake/android.toolchain.cmake" ]]; then
            echo "::error::Android NDK path invalid (ANDROID_NDK_ROOT=${NDK:-empty})"
            exit 1
          fi
          cmake -B "${{ matrix.build_dir }}" -S . \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DVNEIO_CI=ON \
            -DVNEIO_LIB_TYPE=shared \
            -DVNEIO_BUILD_TESTS=OFF \
            -DVNEIO_SANITIZE_INSTALL=ON \
            -DENABLE_IPO=OFF \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX"

      - name: Configure CMake (Emscripten)
        if: matrix.platform == 'web-emscripten'
        shell: bash
        env:
          INSTALL_PREFIX: ${{ github.workspace }}/install
        run: |
          cmake -B "${{ matrix.build_dir }}" -S . \
            -DCMAKE_TOOLCHAIN_FILE="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DVNEIO_CI=ON \
            -DVNEIO_LIB_TYPE=shared \
            -DVNEIO_BUILD_TESTS=OFF \
            -DVNEIO_BUILD_MESH=OFF \
            -DVNEIO_SANITIZE_INSTALL=ON \
            -DENABLE_IPO=OFF \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX"

      - name: Configure CMake (iOS)
        if: matrix.platform == 'ios-static'
        shell: bash
        env:
          INSTALL_PREFIX: ${{ github.workspace }}/install
        run: |
          set -euxo pipefail
          xcodebuild -version
          cmake -B "${{ matrix.build_dir }}" -S . \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DVNEIO_CI=ON \
            -DVNEIO_LIB_TYPE=static \
            -DVNEIO_BUILD_TESTS=OFF \
            -DVNEIO_SANITIZE_INSTALL=ON \
            -DENABLE_IPO=OFF \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX"

      - name: Build
        shell: bash
        run: |
          set -e
          BDIR="${{ matrix.build_dir }}"
          if [[ "${{ matrix.platform }}" == "ios-static" ]]; then
            set -x
            cmake --build "$BDIR" --config Release --parallel --verbose
          else
            cmake --build "$BDIR" --config Release --parallel
          fi

      - name: Install to staging directory
        shell: bash
        run: |
          set -e
          BDIR="${{ matrix.build_dir }}"
          WS="${{ github.workspace }}"
          cmake --install "$BDIR" --config Release
          INSTALL="$WS/install"
          if [[ "${{ matrix.platform }}" == "ios-static" ]]; then
            echo "::group::iOS build tree — static libraries (.a)"
            find "$WS/$BDIR" -type f -name "*.a" 2>/dev/null | sort | head -80 || true
            echo "::endgroup::"
            echo "::group::iOS install prefix — static libraries (.a)"
            find "$INSTALL" -type f -name "*.a" 2>/dev/null | sort || true
            echo "::endgroup::"
          fi
          if [[ ! -d "$INSTALL/include/vertexnova" ]]; then
            echo "::error::Expected install/include/vertexnova missing."
            find "$INSTALL" -type f 2>/dev/null | sort | head -50
            exit 1
          fi
          if [[ -d "$INSTALL/include/vertexnova/logging" ]] || [[ -d "$INSTALL/include/vertexnova/common" ]]; then
            echo "::error::VNEIO_SANITIZE_INSTALL should remove embedded vnelogging/vnecommon headers."
            find "$INSTALL/include/vertexnova" -type d
            exit 1
          fi
          for f in LICENSE CHANGELOG.md; do
            if [[ ! -f "$INSTALL/$f" ]]; then
              echo "::error::Expected install/$f missing."
              exit 1
            fi
          done
          case "${{ matrix.platform }}" in
            web-emscripten)
              if [ -z "$(find "$INSTALL" -type f \( -name '*.wasm' -o -name '*.a' -o -name '*.js' \) -print -quit)" ]; then
                echo "::error::Web install: expected some of .wasm / .a / .js under install/"
                find "$INSTALL" -type f | sort
                exit 1
              fi
              ;;
            ios-static)
              if [ -z "$(find "$INSTALL" -type f -name '*.a' -print -quit)" ]; then
                echo "::error::iOS install: expected at least one .a under install/"
                echo "Listing entire install/ and build tree .a files for diagnosis:"
                find "$INSTALL" -type f 2>/dev/null | sort || true
                find "$WS/$BDIR" -type f -name "*.a" 2>/dev/null | sort | head -100 || true
                exit 1
              fi
              ;;
            *)
              if [ -z "$(find "$INSTALL" -type f \( -iname '*vneio*' -o -iname '*VneIo*' \) -print -quit)" ]; then
                echo "::error::No VneIo library artifacts found under install/"
                find "$INSTALL" -type f | sort
                exit 1
              fi
              ;;
          esac

      - name: Compute artifact detail suffix
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e
          base="${{ matrix.platform }}"
          arch="$(uname -m 2>/dev/null || echo unknown)"
          case "$base" in
            linux-gcc)
              . /etc/os-release 2>/dev/null || true
              vid="${VERSION_ID:-unknown}"
              vid="${vid//./}"
              gcv="$(gcc -dumpfullversion 2>/dev/null || gcc -dumpversion 2>/dev/null || true)"
              gcv="${gcv//./}"
              if [[ -n "$gcv" ]]; then
                detail="ubuntu${vid}-gcc${gcv}-${arch}"
              else
                echo "::notice::gcc version not detected; omitting gcc segment from artifact suffix."
                detail="ubuntu${vid}-${arch}"
              fi
              ;;
            macos)
              macv="$(sw_vers -productVersion 2>/dev/null || echo unknown)"
              macv="${macv//./}"
              xv="$(xcodebuild -version 2>/dev/null | awk '/Xcode/{print $2; exit}')"
              xv="${xv//./}"
              if [[ -n "$xv" ]]; then
                detail="macos${macv}-xcode${xv}-${arch}"
              else
                echo "::notice::Xcode version not parsed; omitting xcode segment from macOS artifact suffix."
                detail="macos${macv}-${arch}"
              fi
              ;;
            windows)
              detail="vs2022-x64"
              ;;
            web-emscripten)
              emv="$(emcc -dumpversion 2>/dev/null || echo unknown)"
              detail="emcc${emv}-${arch}"
              ;;
            ios-static)
              xv="$(xcodebuild -version 2>/dev/null | awk '/Xcode/{print $2; exit}')"
              xv="${xv//./}"
              if [[ -n "$xv" ]]; then
                detail="xcode${xv}-arm64"
              else
                echo "::notice::Xcode version not parsed; using generic iOS artifact suffix."
                detail="ios-arm64"
              fi
              ;;
            android)
              api="24"
              abi_slug="arm64v8a"
              ndk_root="${ANDROID_NDK_ROOT:-}"
              ndk_rev=""
              if [[ -n "$ndk_root" && -f "$ndk_root/source.properties" ]]; then
                ndk_rev="$(grep -E '^[[:space:]]*Pkg.Revision[[:space:]]*=' "$ndk_root/source.properties" | head -1 | cut -d= -f2- | tr -d ' \t\r\n')"
                ndk_rev="${ndk_rev//./}"
              fi
              if [[ -n "$ndk_rev" ]]; then
                detail="android${api}-ndk${ndk_rev}-${abi_slug}"
              else
                echo "::notice::NDK Pkg.Revision not read; omitting ndk segment from Android artifact suffix."
                detail="android${api}-${abi_slug}"
              fi
              ;;
            *)
              detail="${arch}"
              ;;
          esac
          echo "ARTIFACT_DETAIL=${detail}" >> "$GITHUB_ENV"

      - name: Package artifact
        shell: bash
        run: |
          VER="${{ needs.release-please.outputs.version }}"
          ARTIFACT="vneio-v${VER}-${{ matrix.platform }}-${ARTIFACT_DETAIL}.tar.gz"
          tar -czf "${ARTIFACT}" -C "${{ github.workspace }}/install" .
          echo "ARTIFACT=${ARTIFACT}" >> "$GITHUB_ENV"
          echo "Published: ${ARTIFACT}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: ${{ env.ARTIFACT }}
